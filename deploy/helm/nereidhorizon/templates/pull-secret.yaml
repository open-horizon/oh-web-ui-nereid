{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Image pull secret for the private Harbor project hub.yiqisoft.cn/nereidai.
Rendered only when credentials are supplied, so a template-only render (lint,
helm template) without production secrets stays valid.
*/ -}}
{{- if .Values.registryCredentials.username }}
{{- $cred := .Values.registryCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  labels:
    {{- include "nereidhorizon.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict $cred.registry (dict "username" $cred.username "password" $cred.password "email" $cred.email "auth" (printf "%s:%s" $cred.username $cred.password | b64enc))) | toJson | quote }}
{{- end }}
