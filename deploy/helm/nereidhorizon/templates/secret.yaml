{{/*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Single release Secret. Holds the PostgreSQL password, the session master key,
the OIDC client secret and, when the bundled PostgreSQL is used, the
ready-to-use DATABASE_URL.

Password/key stability across upgrades matters: a regenerated master key makes
every stored session undecryptable and a regenerated PostgreSQL password locks
the BFF out. When values leave them empty, reuse the value already stored in
the live Secret (lookup works during `helm upgrade`); only generate a fresh
random value on first install. sha256sum turns random text into exactly the
64 hex chars SESSION_ENC_KEY requires.
*/}}
{{- $fullName := include "nereidhorizon.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullName | default dict -}}

{{- $pgPassword := .Values.postgres.auth.password -}}
{{- if and (not $pgPassword) $existing.data -}}
{{- $pgPassword = index $existing.data "postgres-password" | b64dec -}}
{{- else if not $pgPassword -}}
{{- $pgPassword = randAlphaNum 24 -}}
{{- end -}}

{{- $sessionKey := "" -}}
{{- if $existing.data -}}
{{- $sessionKey = index $existing.data "session-enc-key" | b64dec -}}
{{- else -}}
{{- $sessionKey = randAscii 32 | sha256sum -}}
{{- end -}}

{{- $oidcSecret := .Values.oidc.clientSecret -}}
{{- if and (not $oidcSecret) $existing.data -}}
{{- $oidcSecret = index $existing.data "oidc-client-secret" | b64dec -}}
{{- end -}}

{{- $nsSecret := .Values.ns.clientSecret -}}
{{- if and (not $nsSecret) $existing.data -}}
{{- $nsSecret = index $existing.data "ns-client-secret" | b64dec -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "nereidhorizon.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-enc-key: {{ $sessionKey | quote }}
{{- if .Values.oidc.enabled }}
  oidc-client-secret: {{ $oidcSecret | quote }}
{{- end }}
{{- if .Values.ns.enabled }}
  ns-client-secret: {{ $nsSecret | quote }}
{{- end }}
{{- if .Values.postgres.enabled }}
  postgres-password: {{ $pgPassword | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.auth.username $pgPassword (include "nereidhorizon.postgresSvcName" .) .Values.postgres.auth.database | quote }}
{{- end }}
