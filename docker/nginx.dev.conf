# Dev/local-test nginx config for the docker-dev-* stack.
# Unlike the production nginx.conf (docker-compose.yaml / ghcr image), this:
#   - proxies /api/ to the *dev* backend container (suffix "-dev"), not prod
#   - serves over plain HTTP on :80 (no forced 301 -> https), so the dev stack
#     is reachable at http://localhost:8091 without TLS setup.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to the dev backend (cookie forwarded automatically)
    location /api/ {
        proxy_pass http://open-horizon-exchangeui-backend-dev:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Agbot-Auth $http_x_agbot_auth;
        proxy_set_header X-Root-Auth $http_x_root_auth;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json application/x-font-ttf font/opentype image/svg+xml;
}
