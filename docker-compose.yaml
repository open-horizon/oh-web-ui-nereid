version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: open-horizon-exchangeui-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nereid
      - POSTGRES_USER=nereid
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nereidpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nereid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereid -d nereid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  open-horizon-exchangeui-backend:
    image: ghcr.io/nereidai/open-horizon-exchangeui-backend:latest
    container_name: open-horizon-exchangeui-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://nereid:${POSTGRES_PASSWORD:-nereidpass}@postgres:5432/nereid
      - SESSION_TTL=86400
      - SESSION_ABS_TTL=28800
      # SESSION_ENC_KEY is the 32-byte master key (hex) used for AES-256-GCM
      # encryption of session payloads at rest in PostgreSQL. REQUIRED: without
      # it a random key is generated per boot and every session is lost on
      # restart. Provide 64 hex chars.
      - SESSION_ENC_KEY=${SESSION_ENC_KEY:?SESSION_ENC_KEY is required (64 hex chars)}
      # Optional OpenID Connect single sign-on. Leave OIDC_ISSUER unset to
      # disable SSO and use local password login only.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM:-groups}
      - OIDC_PLATFORM_GROUP=${OIDC_PLATFORM_GROUP:-nereidhorizon-platform}
      - OIDC_PARTNER_GROUP_PREFIX=${OIDC_PARTNER_GROUP_PREFIX:-nereidhorizon-partner-}
      - OIDC_LOCAL_LOGIN_ENABLED=${OIDC_LOCAL_LOGIN_ENABLED:-true}
      - OIDC_INSECURE_SKIP_VERIFY=${OIDC_INSECURE_SKIP_VERIFY:-false}
    volumes:
      - nereid-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nereid-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  open-horizon-exchangeui-frontend:
    image: ghcr.io/nereidai/open-horizon-exchangeui-frontend:latest
    container_name: open-horizon-exchangeui-frontend
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8090:80"
    depends_on:
      open-horizon-exchangeui-backend:
        condition: service_healthy
    networks:
      - nereid-network

networks:
  nereid-network:
    driver: bridge

volumes:
  nereid-logs:

  postgres-data:
