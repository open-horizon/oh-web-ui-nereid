version: '3.8'

services:
  redis:
    image: redis:6.2.2-alpine
    container_name: open-horizon-exchangeui-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - nereid-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: open-horizon-exchangeui-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nereid
      - POSTGRES_USER=nereid
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nereidpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nereid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereid -d nereid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  open-horizon-exchangeui-backend:
    image: ghcr.io/nereidai/open-horizon-exchangeui-backend:latest
    container_name: open-horizon-exchangeui-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://nereid:${POSTGRES_PASSWORD:-nereidpass}@postgres:5432/nereid
      - SESSION_TTL=86400
      - SESSION_ABS_TTL=28800
      # SESSION_ENC_KEY is the 32-byte master key (hex) used for AES-256-GCM encryption
      # of Exchange credentials at rest. Override in production via secret/env file.
      - SESSION_ENC_KEY=${SESSION_ENC_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - nereid-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nereid-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  open-horizon-exchangeui-frontend:
    image: ghcr.io/nereidai/open-horizon-exchangeui-frontend:latest
    container_name: open-horizon-exchangeui-frontend
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8090:80"
    depends_on:
      open-horizon-exchangeui-backend:
        condition: service_healthy
    networks:
      - nereid-network

networks:
  nereid-network:
    driver: bridge

volumes:
  nereid-logs:

  redis-data:

  postgres-data:
