# Production stack: pulls the published multi-arch images from GHCR.
# Pin IMAGE_TAG to a release tag (for example v0.0.1) for reproducible deploys;
# it defaults to "latest".
#
# Joins the external network created by the Open Horizon mgmt-hub
# (`hzn_horizonnet`). Deploy the mgmt-hub first (its compose creates the
# network), then start this stack.
services:
  # Named `nereid-postgres` (not `postgres`) on purpose: the mgmt-hub also runs
  # a container/service called `postgres` on `hzn_horizonnet`, and two identical
  # DNS aliases would make the backend resolve to the wrong (Exchange) database.
  nereid-postgres:
    image: postgres:17
    container_name: oh-web-ui-nereid-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nereid
      - POSTGRES_USER=nereid
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nereidpass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hzn_horizonnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereid -d nereid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  oh-web-ui-nereid-backend:
    image: ghcr.io/open-horizon/oh-web-ui-nereid-backend:${IMAGE_TAG:-latest}
    container_name: oh-web-ui-nereid-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgres://nereid:${POSTGRES_PASSWORD:-nereidpass}@nereid-postgres:5432/nereid}
      - SESSION_TTL=86400
      - SESSION_ABS_TTL=28800
      # SESSION_ENC_KEY is the 32-byte master key (hex) used for AES-256-GCM
      # encryption of session payloads at rest in PostgreSQL. REQUIRED: without
      # it a random key is generated per boot and every session is lost on
      # restart. Provide 64 hex chars.
      - SESSION_ENC_KEY=${SESSION_ENC_KEY:?SESSION_ENC_KEY is required (64 hex chars)}
      # Optional: auto-bootstrap (skip Setup UI). All five must be set together.
      - EXCHANGE_URL=${EXCHANGE_URL:-}
      - EXCHANGE_USER=${EXCHANGE_USER:-}
      - EXCHANGE_PASSWORD=${EXCHANGE_PASSWORD:-}
      - BOOTSTRAP_ADMIN_USER=${BOOTSTRAP_ADMIN_USER:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Optional: trust a CA/self-signed cert for HTTPS Exchange (path to PEM inside container).
      - EXCHANGE_CA_CERT=${EXCHANGE_CA_CERT:-}
      # Optional OpenID Connect single sign-on. Leave OIDC_ISSUER unset to
      # disable SSO and use local password login only.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM:-groups}
      - OIDC_PLATFORM_GROUP=${OIDC_PLATFORM_GROUP:-nereidhorizon-platform}
      - OIDC_PARTNER_GROUP_PREFIX=${OIDC_PARTNER_GROUP_PREFIX:-nereidhorizon-partner-}
      - OIDC_LOCAL_LOGIN_ENABLED=${OIDC_LOCAL_LOGIN_ENABLED:-true}
      - OIDC_INSECURE_SKIP_VERIFY=${OIDC_INSECURE_SKIP_VERIFY:-false}
      # Optional NereidSphere ticket SSO (takes precedence over direct OIDC).
      - NS_BASE_URL=${NS_BASE_URL:-}
      - NS_PRODUCT_ID=${NS_PRODUCT_ID:-}
      - NS_CLIENT_SECRET=${NS_CLIENT_SECRET:-}
      - NS_CALLBACK_PATH=${NS_CALLBACK_PATH:-/auth/ns-callback}
    volumes:
      - nereid-logs:/app/logs
    depends_on:
      nereid-postgres:
        condition: service_healthy
    networks:
      - hzn_horizonnet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  oh-web-ui-nereid-frontend:
    image: ghcr.io/open-horizon/oh-web-ui-nereid-frontend:${IMAGE_TAG:-latest}
    container_name: oh-web-ui-nereid-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDR:-0.0.0.0}:8443:443"
      - "${FRONTEND_BIND_ADDR:-0.0.0.0}:8090:80"
    depends_on:
      oh-web-ui-nereid-backend:
        condition: service_healthy
    networks:
      - hzn_horizonnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  hzn_horizonnet:
    external: true
    name: hzn_horizonnet

volumes:
  nereid-logs:

  postgres-data:
