            type: string
      responses:
        '200':
          description: Policy list
    post:
      tags: [Agbot Business Policies]
      summary: Bind business policy to agbot
      operationId: bindAgbotBusinessPol
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessPolOrgid, businessPol, nodeOrgid]
              properties:
                businessPolOrgid:
                  type: string
                businessPol:
                  type: string
                nodeOrgid:
                  type: string
      responses:
        '200':
          description: Bind success

  /api/agbots/{id}/businesspols/{polId}:
    delete:
      tags: [Agbot Business Policies]
      summary: Unbind agbot business policy
      operationId: unbindAgbotBusinessPol
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: polId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unbind success

  # =============================================================
  # HA Groups
  # =============================================================
  /api/hagroups:
    get:
      tags: [HA Groups]
      summary: List HA groups
      description: Returns an object keyed by group name.
      operationId: listHaGroups
      security:
        - SessionCookie: []
      responses:
        '200':
          description: HA groups list

  /api/hagroups/{id}:
    get:
      tags: [HA Groups]
      summary: Get a single HA group
      operationId: getHaGroup
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HA group detail
    post:
      tags: [HA Groups]
      summary: Create HA group
      description: |
        Uses HTTP POST (Exchange requires POST for node group creation).
        Only `description` and optional `network` are accepted.
        `name` is taken from the path.
      operationId: createHaGroup
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                network:
                  type: object
                  properties:
                    type:
                      type: string
      responses:
        '201':
          description: Created successfully
    delete:
      tags: [HA Groups]
      summary: Delete HA group
      operationId: deleteHaGroup
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully

  /api/hagroups/{id}/nodes/{nodeId}:
    put:
      tags: [HA Groups]
      summary: Add node to HA group
      operationId: addHaGroupNode
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node added
    delete:
      tags: [HA Groups]
      summary: Remove node from HA group
      operationId: removeHaGroupNode
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node removed

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: nereid_sid
      description: HttpOnly; SameSite=Strict session cookie issued on login.
    CsrfToken:
      type: apiKey
      in: header
      name: X-Csrf-Token
      description: CSRF token (hex string) returned by login. Required on all mutating requests (POST/PUT/PATCH/DELETE) that carry a session cookie.

  parameters:
    OrgQuery:
      name: org
      in: query
      required: false
      schema:
        type: string
      description: Target org ID for cross-org queries
      example: myorg

  schemas:
    ServiceDeploymentServices:
      type: object
      description: Deployment image definition (keyed by service name)
      properties:
        image:
          type: string
        ports:
          type: array
          items:
            type: object
            properties:
              HostPort:
                type: string
        privileged:
          type: boolean
        devices:
          type: array
          items:
            type: string
        command:
          type: array
          items:
            type: string
        entrypoint:
          type: array
          items:
            type: string
        binds:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        user:
          type: string
        pid:
          type: string
        ipc:
          type: string
        maxMemoryMb:
          type: integer
        maxCpus:
          type: string
        ephemeralPorts:
          type: array
          items:
            type: string
        tmpfs:
          type: object
          additionalProperties:
            type: string
        cap_add:
          type: array
          items:
            type: string
        sysctls:
          type: object
          additionalProperties:
            type: string
        logDriver:
          type: string
        secrets:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              cert:
                type: string
              seal:
                type: object

    ServiceBody:
      type: object
      required: [label, url, version, arch]
      properties:
        label:
          type: string
        description:
          type: string
        url:
          type: string
        version:
          type: string
        arch:
          type: string
        sharable:
          type: string
          enum: [single, multiple]
          default: multiple
        public:
          type: boolean
          default: false
        matchHardware:
          type: object
        requiredServices:
          type: array
          items:
            type: object
        userInput:
          type: array
          items:
            type: object
        deployment:
          type: object
          description: Deployment config (auto-stringified and signed)
          properties:
            services:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ServiceDeploymentServices'
        deploymentSignature:
          type: string
        imageStore:
          type: string
        documentation:
          type: string
        clusterDeployment:
          type: object
        clusterDeploymentSignature:
          type: string

    PService:
      type: object
      description: Service reference within a pattern
      properties:
        serviceOrgID:
          type: string
        serviceArch:
          type: string
        serviceVersions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              priority:
                type: object
                properties:
                  priority_value:
                    type: integer
                  retries:
                    type: integer
              upgradePolicy:
                type: string
                enum: [null, immediate, never, conservative]
        nodeHealth:
          type: object
        dataVerify:
          type: string
