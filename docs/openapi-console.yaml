  # =============================================================
  # Nodes
  # =============================================================
  /api/nodes:
    get:
      tags: [Nodes]
      summary: List nodes in current org
      description: Supports `?org=` for cross-org queries.
      operationId: listNodes
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
      responses:
        '200':
          description: Node list

  /api/nodes/{id}:
    patch:
      tags: [Nodes]
      summary: Update node fields (pattern, userInput, etc.)
      description: |
        Partial update of node attributes. Only the supplied fields are changed.
        If `pattern` field does not contain `/`, `{orgId}/` prefix is prepended.
        `userInput` is an array of service user-input definitions, each containing
        service identification (`serviceOrgid`, `serviceUrl`, `serviceArch`,
        `serviceVersionRange`) and an `inputs` array of `{name, value}` pairs.
      operationId: patchNode
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Node ID (org prefix stripped automatically)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                  example: myorg/h-n
                nodeType:
                  type: string
                softwareVersions:
                  type: object
                token:
                  type: string
                name:
                  type: string
                userInput:
                  type: array
                  description: Service user-input definitions
                  items:
                    type: object
                    properties:
                      serviceOrgid:
                        type: string
                        example: yiqisoft
                      serviceUrl:
                        type: string
                        example: busybox
                      serviceArch:
                        type: string
                        example: amd64
                      serviceVersionRange:
                        type: string
                        example: 1.0.0
                      inputs:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: myvar
                            value:
                              type: string
                              example: myvalue
      responses:
        '200':
          description: Operation result
    put:
      tags: [Nodes]
      summary: Create or update a node (upsert)
      operationId: upsertNode
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Node created or updated
