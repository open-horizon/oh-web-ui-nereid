  # =============================================================
  /api/agentfileversion:
    get:
      tags: [Agent File Version]
      summary: Get agent file version
      operationId: getAgentFileVersion
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: Agent file version
    put:
      tags: [Agent File Version]
      summary: Set agent file version
      operationId: setAgentFileVersion
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Version set
    delete:
      tags: [Agent File Version]
      summary: Delete agent file version
      operationId: deleteAgentFileVersion
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
