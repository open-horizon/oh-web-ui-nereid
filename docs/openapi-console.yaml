                  type: object
      responses:
        '201':
          description: Created successfully

  /api/mgmtpolicies/{id}:
    put:
      tags: [Management Policies]
      summary: Update management policy
      operationId: updateMgmtPolicy
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Update result
    delete:
      tags: [Management Policies]
      summary: Delete management policy
      operationId: deleteMgmtPolicy
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delete result

  # =============================================================
  # Catalog
  # =============================================================
  /api/catalog-services:
    get:
      tags: [Catalog]
      summary: List catalog services
      description: Returns services from public orgs (IBM, etc.).
      operationId: listCatalogServices
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Catalog service list

  /api/catalog-patterns:
    get:
