openapi: 3.0.3
info:
  title: NereidAI Console API
  description: |
    BFF (Backend-For-Frontend) proxy for the Open Horizon Exchange API.

    **Authentication:**
    - Session cookie (`nereid_sid`): HttpOnly, SameSite=Lax, Secure on HTTPS.
    - CSRF protection: Mutating requests (POST/PUT/PATCH/DELETE) require both
      the `nereid_csrf` cookie and the `X-Csrf-Token` header with matching values.
    - Public endpoints (health, setup-status, setup, login, oidc) do not require auth.
    - Two BFF roles exist: `platform` (full access) and `partner` (read-only
      on Exchange resources + self-service API key management).
    - Local password login may be disabled (`OIDC_LOCAL_LOGIN_ENABLED=false`);
      the bootstrap admin can always sign in at `/login?local=1`.
    - Generic OpenID Connect SSO (authorization code + PKCE) is available at
      `/api/oidc/login` when `OIDC_ISSUER` is configured. Roles are derived
      from a group claim (platform group + `nereidhorizon-partner-<org>`
      prefixes); users are JIT-provisioned and identified by `(issuer, subject)`.

    **Data layer:**
    - Local BFF users, Exchange config, API keys, audit log, and server-side
      sessions are stored in PostgreSQL (required). Sessions are encrypted with
      AES-256-GCM under `SESSION_ENC_KEY`.
    - Exchange credentials are stored once at the system level and shared by
      all sessions; users never supply Exchange credentials directly.
  version: 2.2.0
  contact:
    name: NereidAI

servers:
  - url: http://localhost:3001
    description: Development
  - url: /api
    description: Via reverse proxy (HTTPS in production)

tags:
  - name: Auth
  - name: System
  - name: Organizations
  - name: Users
  - name: Nodes
  - name: Services
  - name: Patterns
  - name: Deployment Policies
  - name: Management Policies
  - name: Catalog
  - name: Agbots
  - name: Agbot Patterns
  - name: Agbot Business Policies
  - name: HA Groups
  - name: Dashboard
  - name: Registry
  - name: Search
  - name: Changes
  - name: Agent File Version
  - name: Secrets
  - name: Service Instances

paths:
  # =============================================================
  # Auth (BFF user)
  # =============================================================
  /api/setup-status:
    get:
      tags: [Auth]
      summary: First-time setup status
      description: Returns whether the system has been initialized (admin user + Exchange config).
      operationId: setupStatus
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup:
                    type: boolean
                    description: No admin user exists yet
                  exchangeConfigured:
                    type: boolean
                    description: Exchange connection has been configured
                  oidcEnabled:
                    type: boolean
                    description: OpenID Connect SSO is configured (OIDC_ISSUER set)
                  oidcConfigured:
                    type: boolean
                    description: All required OIDC settings are present
                  localLoginEnabled:
                    type: boolean
                    description: Local password login is permitted for regular users

  /api/setup:
    post:
      tags: [Auth]
      summary: First-time setup
      description: |
        Creates the initial platform admin user AND configures the Exchange
        connection in one step. Runs Exchange credential verification before
        persisting. Only works when no admin user exists.
      operationId: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUser, adminPassword, baseURL, user, password]
              properties:
                adminUser:
                  type: string
                  description: BFF platform admin username
                  example: admin
                adminPassword:
                  type: string
                  description: BFF platform admin password
                  example: admin123
                baseURL:
                  type: string
                  format: uri
                  description: Exchange base URL
                  example: http://192.168.123.133:3090
                user:
                  type: string
                  description: Exchange credential user (org/username)
                  example: myorg/admin
                password:
                  type: string
                  description: Exchange credential password
                  example: WmgHbLbxWjxQifijLxMpIUNhZaPjgf
      responses:
        '200':
          description: Setup complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          description: Already initialized or missing parameters

  /api/login:
    post:
      tags: [Auth]
      summary: BFF user login (local password)
      description: |
        Authenticates against the local BFF user store. On success, sets the
        `nereid_sid` HttpOnly session cookie and the `nereid_csrf` cookie.
        The CSRF token is also returned in the JSON body for the SPA to use
        in the `X-Csrf-Token` header on mutating requests.

        Rate limited: five failed attempts per (IP, username) within five
        minutes lock further attempts with `429`. Returns `403` when local
        login is disabled (only the bootstrap admin may still sign in).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
                org:
                  type: string
                  description: Optional bound org for partner accounts with duplicate usernames
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: nereid_sid (HttpOnly) + nereid_csrf
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId:
                    type: string
                    example: myorg
                  version:
                    type: string
                    example: 2.154.0
                  role:
                    type: string
                    enum: [platform, partner]
                    example: platform
                  username:
                    type: string
                    example: admin
                  org:
                    type: string
                    nullable: true
                    description: Partner user's bound org (null for platform)
                  availableOrgs:
                    type: array
                    items:
                      type: string
                    description: Orgs this session may operate on
                  authType:
                    type: string
                    enum: [local, oidc]
                    example: local
                  csrfToken:
                    type: string
                    description: CSRF token (also set as cookie)
        '400':
          description: Exchange not configured
        '401':
          description: Invalid credentials
        '403':
          description: Account disabled, or local login disabled (use SSO or /login?local=1)
        '429':
          description: Too many failed attempts

  /api/oidc/login:
    get:
      tags: [Auth]
      summary: Start OpenID Connect SSO login
      description: |
        Redirects the browser to the IdP authorization endpoint using the
        authorization-code flow with PKCE. `state`, `nonce`, and the PKCE
        verifier are sealed in a short-lived `nereid_oidc` HttpOnly cookie.
        Failures redirect to `/login?oidc_error=<code>`.
      operationId: oidcLogin
      responses:
        '302':
          description: Redirect to the IdP authorization endpoint (or back to /login?oidc_error=...)

  /api/oidc/callback:
    get:
      tags: [Auth]
      summary: OpenID Connect SSO callback
      description: |
        Exchanges the authorization code, validates the ID token, maps the
        group claim to a BFF role, JIT-provisions or updates the federated
        user, and issues the normal session cookies. On any failure it clears
        the state cookie and redirects to `/login?oidc_error=<code>` where
        `<code>` is one of: `state_missing`, `state_invalid`, `idp_denied`,
        `callback_invalid`, `no_group`, `ambiguous_groups`,
        `invalid_org_claim`, `unknown_org`, `email_unverified`,
        `account_disabled`, `callback_failed`, `oidc_unavailable`,
        `oidc_disabled`, `not_configured`.
      operationId: oidcCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `/` on success, or `/login?oidc_error=<code>` on failure

  /api/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: |
        Destroys the server-side session and clears cookies. For OIDC sessions
        the provider's end-session URL is returned so the SPA can also complete
        RP-initiated logout upstream.
      operationId: logout
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  redirect:
                    type: string
                    nullable: true
                    description: IdP end-session URL for OIDC sessions, else null
        '403':
          description: CSRF validation failed

  /api/me:
    get:
      tags: [Auth]
      summary: Current session info
      description: Used by the SPA to restore session on page refresh.
      operationId: me
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId:
                    type: string
                    example: myorg
                  version:
                    type: string
                    example: 2.154.0
                  role:
                    type: string
                    enum: [platform, partner]
                    example: platform
                  username:
                    type: string
                    example: admin
                  org:
                    type: string
                    nullable: true
                  availableOrgs:
                    type: array
                    items:
                      type: string
                  authType:
                    type: string
                    enum: [local, oidc]
                  email:
                    type: string
                    nullable: true
                  csrfToken:
                    type: string
        '401':
          description: Not authenticated

  /api/switch-org:
    post:
      tags: [Auth]
      summary: Switch effective org (partner multi-org)
      description: |
        Partner accounts granted multiple orgs via SSO groups may switch the
        effective org. The target must be one of the orgs captured at last
        login (`availableOrgs`). Platform accounts cannot switch.
      operationId: switchOrg
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org]
              properties:
                org:
                  type: string
                  example: acme
      responses:
        '200':
          description: Org switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  orgId:
                    type: string
        '403':
          description: Not a partner, or org not granted by SSO

  # =============================================================
  # Health
  # =============================================================
  /api/health:
    get:
      tags: [System]
      summary: Health check
      description: No authentication required. Used by container health check.
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # =============================================================
  # BFF User Management (platform only)
  # =============================================================
  /api/bff-users:
    get:
      tags: [Users]
      summary: List BFF users
      description: Platform only. Returns all local BFF users (not Exchange users).
      operationId: listBffUsers
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        role:
                          type: string
                          enum: [platform, partner]
                        org:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        email:
                          type: string
                          nullable: true
                        issuer:
                          type: string
                          nullable: true
                          description: OIDC issuer (null for local accounts)
                        subject:
                          type: string
                          nullable: true
                          description: OIDC subject (null for local accounts)
                        disabled:
                          type: boolean
                        bootstrap:
                          type: boolean
                          description: The break-glass bootstrap admin
                        authType:
                          type: string
                          enum: [local, oidc]
    post:
      tags: [Users]
      summary: Create BFF user
      description: Platform only. Creates a platform or partner user.
      operationId: createBffUser
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                  example: acme
                password:
                  type: string
                  example: acme123
                role:
                  type: string
                  enum: [platform, partner]
                  example: partner
                org:
                  type: string
                  description: Required for partner role
                  example: myorg
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '409':
          description: User already exists

  /api/bff-users/{username}:
    delete:
      tags: [Users]
      summary: Delete BFF user
      description: |
        Platform only. Cannot delete yourself or the bootstrap admin. OIDC users
        are identified by the `issuer`/`subject` query params; local users are
        identified by `username` (+ optional `org`). Set `deleteExchangeUser=true`
        to also delete the corresponding Exchange user (local partner accounts).
      operationId: deleteBffUser
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: org
          in: query
          required: false
          schema:
            type: string
          description: Disambiguates cross-org duplicate local usernames
        - name: issuer
          in: query
          required: false
          schema:
            type: string
          description: OIDC issuer (with subject) to delete a federated user
        - name: subject
          in: query
          required: false
          schema:
            type: string
          description: OIDC subject (with issuer) to delete a federated user
        - name: deleteExchangeUser
          in: query
          required: false
          schema:
            type: boolean
          description: Also delete the matching Exchange user
      responses:
        '200':
          description: User deleted
        '400':
          description: Cannot delete yourself or the bootstrap admin
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Update BFF user role/org/password
      description: Platform only. Update a user's role, bound org, or password.
      operationId: updateBffUser
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: org
          in: query
          required: false
          schema:
            type: string
          description: Target Exchange org for cross-org queries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [platform, partner]
                org:
                  type: string
                  description: New bound org for partner user
                newPassword:
                  type: string
      responses:
        '200':
          description: User updated
        '400':
          description: Cannot change own role or org

  /api/bff-users/{username}/password:
    put:
      tags: [Users]
      summary: Change user password
      description: Platform can change any user's password; partner can only change own.
      operationId: changeBffUserPassword
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: newpass123
      responses:
        '200':
          description: Password changed

  /api/bff-users/{username}/disabled:
    put:
      tags: [Users]
      summary: Enable/disable a BFF user
      description: |
        Platform only. Disabling is preferred over deletion for OIDC users
        because deletion would be silently undone by JIT provisioning on the
        next login. The bootstrap admin cannot be disabled. OIDC users are
        identified by the `issuer`/`subject` query params; local users by
        `username` (+ optional `org`).
      operationId: setBffUserDisabled
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: org
          in: query
          required: false
          schema:
            type: string
        - name: issuer
          in: query
          required: false
          schema:
            type: string
        - name: subject
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        '200':
          description: User updated
        '400':
          description: Cannot disable the bootstrap admin
        '404':
          description: User not found

  # =============================================================
  # Exchange Configuration (platform only)
  # =============================================================
  /api/exchange-config:
    get:
      tags: [System]
      summary: Get Exchange configuration
      description: Platform only. Returns the current Exchange connection settings.
      operationId: getExchangeConfig
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Exchange config
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  baseURL:
                    type: string
                    example: http://192.168.123.133:3090
                  orgId:
                    type: string
                    example: myorg
                  user:
                    type: string
                    description: Masked Exchange credential
                    example: myorg/admin:***
    put:
      tags: [System]
      summary: Update Exchange configuration
      description: |
        Platform only. Validates the new credentials against Exchange before
        persisting. Changes propagate to all active sessions immediately.
      operationId: updateExchangeConfig
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseURL, user, password]
              properties:
                baseURL:
                  type: string
                  example: http://192.168.123.133:3090
                user:
                  type: string
                  example: myorg/admin
                password:
                  type: string
                  example: WmgHbLbxWjxQifijLxMpIUNhZaPjgf
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          description: Exchange credential verification failed

  /api/exchange-config/test:
    post:
      tags: [System]
      summary: Test Exchange connection
      description: Platform only. Validates Exchange credentials without persisting.
      operationId: testExchangeConfig
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseURL, user, password]
              properties:
                baseURL:
                  type: string
                user:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  msg:
                    type: string

  # =============================================================
  # System Settings (platform only)
  # =============================================================
  /api/settings:
    get:
      tags: [System]
      summary: Get system settings
      description: Platform only. Returns session timeout and audit retention settings.
      operationId: getSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_ttl:
                    type: integer
                    description: Session idle timeout in seconds
                  session_abs_ttl:
                    type: integer
                    description: Session absolute timeout in seconds
                  audit_retention_days:
                    type: integer
                    description: Audit log retention days (0 = unlimited)
        '401':
          description: Not authenticated
        '403':
          description: Platform role required
    put:
      tags: [System]
      summary: Update system settings
      description: Platform only. Update session timeout and audit retention parameters.
      operationId: updateSettings
      security:
        - cookieAuth: []
        - csrfAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_ttl:
                  type: integer
                  description: Session idle timeout in seconds
                session_abs_ttl:
                  type: integer
                  description: Session absolute timeout in seconds
                audit_retention_days:
                  type: integer
                  description: Audit log retention days (0 = unlimited)
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid parameters
        '401':
          description: Not authenticated
        '403':
          description: Platform role required

  # =============================================================
  # Registry
  # =============================================================
  /api/registry/search:
    get:
      tags: [Registry]
      summary: Search Docker registry for images
      description: Searches Docker Hub or custom registry for matching images.
      operationId: searchRegistry
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: Search results

  /api/registry/tags:
    get:
      tags: [Registry]
      summary: List tags for a registry image
      operationId: listRegistryTags
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: image
          in: query
          required: true
          schema:
            type: string
          description: Image name (e.g. library/alpine)
      responses:
        '200':
          description: Tag list

  /api/registry/test:
    post:
      tags: [Registry]
      summary: Test registry connectivity
      operationId: testRegistry
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registry_url:
                  type: string
                registry_insecure:
                  type: boolean
                registry_username:
                  type: string
                registry_password:
                  type: string
      responses:
        '200':
          description: Test result

  # =============================================================
  # API Key Management (platform and partner)
  # =============================================================
  /api/apikeys:
    get:
      tags: [Users]
      summary: List all API keys
      description: Platform only. Returns all API keys across all orgs (without the plaintext secret).
      operationId: listApiKeys
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org:
                          type: string
                        label:
                          type: string
                        revoked:
                          type: boolean
                        expiresAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        createdBy:
                          type: string
    post:
      tags: [Users]
      summary: Create API key
      description: Platform only. Creates an API key for any org.
      operationId: createApiKey
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org, label]
              properties:
                org:
                  type: string
                  example: myorg
                label:
                  type: string
                  example: acme-prod
                expiresInDays:
                  type: integer
                  example: 365
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                    description: Plaintext key (only returned once)
                    example: nk_test_abc123...
                  org:
                    type: string

  /api/apikeys/{id}:
    delete:
      tags: [Users]
      summary: Delete API key
      description: Platform only. Hard-deletes an API key.
      operationId: deleteApiKey
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key deleted

  /api/apikeys/{id}/renew:
    post:
      tags: [Users]
      summary: Renew an API key
      description: Platform only. Generates a new key secret for the same API key id.
      operationId: renewApiKey
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
