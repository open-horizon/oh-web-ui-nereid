        '200':
          description: Policy list
    post:
      tags: [Deployment Policies]
      summary: Create deployment policy
      description: Strips `name` field, uses `sanitizeBody` filtering.
      operationId: createPolicy
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                label:
                  type: string
                description:
                  type: string
                businessPolicy:
                  type: object
      responses:
        '200':
          description: Create result

  /api/policies/{id}:
    delete:
      tags: [Deployment Policies]
      summary: Delete deployment policy
      operationId: deletePolicy
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delete result

