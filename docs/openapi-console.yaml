  # =============================================================
  # Agbots
  # =============================================================
  /api/agbots:
    get:
      tags: [Agbots]
      summary: List agbots
      description: Supports `?org=`. Automatically merges IBM org agbots.
      operationId: listAgbots
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
      responses:
        '200':
          description: Agbot list

  /api/agbots/{id}:
    put:
      tags: [Agbots]
      summary: Create/update agbot
      operationId: updateAgbot
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operation result
    patch:
      tags: [Agbots]
      summary: Partial update agbot
      operationId: patchAgbot
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operation result
    delete:
      tags: [Agbots]
      summary: Delete agbot
      operationId: deleteAgbot
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operation result

  /api/agbots/{id}/patterns:
    get:
      tags: [Agbot Patterns]
      summary: List patterns bound to agbot
      operationId: listAgbotPatterns
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pattern list
    post:
      tags: [Agbot Patterns]
      summary: Bind pattern to agbot
      description: Auto-fills `nodeOrgid` defaults.
      operationId: bindAgbotPattern
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patternOrgid, pattern, nodeOrgid]
              properties:
                patternOrgid:
                  type: string
                pattern:
                  type: string
                nodeOrgid:
                  type: string
      responses:
        '200':
          description: Bind success

  /api/agbots/{id}/patterns/{patternId}:
    delete:
      tags: [Agbot Patterns]
      summary: Unbind agbot pattern
      operationId: unbindAgbotPattern
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/OrgQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: patternId
          in: path
          required: true
          schema:
            type: string
