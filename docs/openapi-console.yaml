          description: Deleted successfully

  /api/hagroups/{id}/nodes/{nodeId}:
    put:
      tags: [HA Groups]
      summary: Add node to HA group
      operationId: addHaGroupNode
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node added
    delete:
      tags: [HA Groups]
      summary: Remove node from HA group
      operationId: removeHaGroupNode
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node removed

  # =============================================================
