  # =============================================================
  # Secrets
  # =============================================================
  /api/secrets:
    get:
      tags: [Secrets]
      summary: List secrets
      description: Returns empty object. Secrets are managed by Vault/OpenBao, not Exchange.
      operationId: listSecrets
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: Secret list
    post:
      tags: [Secrets]
      summary: Create secret
      description: Stub endpoint. Returns 400 with message to use Secrets Manager.
      operationId: createSecret
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '400':
          description: Secrets not managed through Exchange

  /api/secrets/{name}:
    delete:
      tags: [Secrets]
      summary: Delete secret
      description: Stub endpoint. Returns 400 with message to use Secrets Manager.
      operationId: deleteSecret
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '400':
          description: Secrets not managed through Exchange

  # =============================================================
  # Service Instances
  # =============================================================
  /api/service-instances:
    get:
      tags: [Service Instances]
      summary: List all service instances across nodes and orgs
      description: Aggregates across all nodes and enriches with node status.
      operationId: listServiceInstances
      security:
        - SessionCookie: []
        - CsrfToken: []
      responses:
        '200':
          description: Service instance list

  /api/service-instances/{id}:
    get:
      tags: [Service Instances]
      summary: Get a specific service instance
      description: Instance ID format is nodeId/serviceKey.
      operationId: getServiceInstance
      security:
        - SessionCookie: []
        - CsrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service instance detail

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: nereid_sid
      description: HttpOnly; SameSite=Strict session cookie issued on login.
    CsrfToken:
      type: apiKey
      in: header
      name: X-Csrf-Token
      description: CSRF token (hex string) returned by login. Required on all mutating requests (POST/PUT/PATCH/DELETE) that carry a session cookie.

  parameters:
    OrgQuery:
      name: org
      in: query
      required: false
      schema:
        type: string
      description: Target org ID for cross-org queries
      example: myorg

  schemas:
    ServiceDeploymentServices:
      type: object
      description: Deployment image definition (keyed by service name)
      properties:
        image:
          type: string
        ports:
          type: array
          items:
            type: object
            properties:
              HostPort:
                type: string
        privileged:
          type: boolean
        devices:
          type: array
          items:
            type: string
        command:
          type: array
          items:
            type: string
        entrypoint:
          type: array
          items:
            type: string
        binds:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        user:
          type: string
        pid:
          type: string
        ipc:
          type: string
        maxMemoryMb:
          type: integer
        maxCpus:
          type: string
        ephemeralPorts:
          type: array
          items:
            type: string
        tmpfs:
          type: object
          additionalProperties:
            type: string
        cap_add:
          type: array
          items:
            type: string
        sysctls:
          type: object
          additionalProperties:
            type: string
        logDriver:
          type: string
        secrets:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              cert:
                type: string
              seal:
                type: object

    ServiceBody:
      type: object
      required: [label, url, version, arch]
      properties:
        label:
          type: string
        description:
          type: string
        url:
          type: string
        version:
          type: string
        arch:
          type: string
        sharable:
          type: string
          enum: [single, multiple]
          default: multiple
        public:
          type: boolean
          default: false
        matchHardware:
          type: object
        requiredServices:
          type: array
          items:
            type: object
        userInput:
          type: array
          items:
            type: object
        deployment:
          type: object
          description: Deployment config (auto-stringified and signed)
          properties:
            services:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ServiceDeploymentServices'
        deploymentSignature:
          type: string
        imageStore:
          type: string
        documentation:
          type: string
        clusterDeployment:
          type: object
        clusterDeploymentSignature:
          type: string

    PService:
      type: object
      description: Service reference within a pattern
      properties:
        serviceOrgID:
          type: string
        serviceArch:
          type: string
        serviceVersions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              priority:
                type: object
                properties:
                  priority_value:
                    type: integer
                  retries:
                    type: integer
              upgradePolicy:
                type: string
                enum: [null, immediate, never, conservative]
        nodeHealth:
          type: object
        dataVerify:
          type: string
