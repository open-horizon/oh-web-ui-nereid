  # =============================================================
  # Audit Log
  # =============================================================
  /api/audit:
    get:
      tags: [System]
      summary: Read audit log
      description: |
        Platform sees all orgs. Partner sees only own org.
        Entries are sorted newest-first.
      operationId: getAudit
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Max entries to return
        - name: org
          in: query
          schema:
            type: string
          description: Filter by org (platform only)
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        t:
                          type: string
                          format: date-time
                        type:
                          type: string
                          enum: [api, exchange]
                        m:
                          type: string
                          description: HTTP method
                        p:
                          type: string
                          description: Request path
                        s:
                          type: integer
                          description: HTTP status code
                        ms:
                          type: integer
                          description: Response time in ms
                        u:
                          type: string
                          description: User or apikey label
                        o:
                          type: string
                          description: Org
                        op:
                          type: string
                          description: Human-readable operation description
                        body:
                          type: object
                          nullable: true
                        proxiedTo:
                          type: string
                          nullable: true
                          description: Actual Exchange endpoint proxied to

