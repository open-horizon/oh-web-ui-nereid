          description: Node errors
  /api/v1/{org}/nodes/{id}/managementStatus:
    get:
      tags: [Nodes]
      summary: Get node management status
      operationId: partnerGetNodeMgmtStatus
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: id
          in: path
          required: true
