            type: string
      responses:
        '200':
          description: Node management status

  # =============================================================
  # Users (org users, not BFF accounts)
  # =============================================================
  /api/v1/{org}/users:
    get:
      tags: [Users]
      summary: List org users in Exchange
      operationId: partnerListUsers
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: User list
  /api/v1/{org}/users/{username}:
    get:
      tags: [Users]
      summary: Get org user detail
      operationId: partnerGetUser
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
