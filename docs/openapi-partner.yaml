      responses:
        '200':
          description: User detail

  # =============================================================
  # HA Groups
  # =============================================================
  /api/v1/{org}/hagroups:
    get:
      tags: [HA Groups]
      summary: List HA groups
      operationId: partnerListHaGroups
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: HA group list
  /api/v1/{org}/hagroups/{id}:
    get:
      tags: [HA Groups]
      summary: Get HA group detail
      operationId: partnerGetHaGroup
      security:
        - ApiKeyAuth: []
      parameters:
