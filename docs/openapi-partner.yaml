  /api/v1/{org}/nodes/{id}/agreements:
    get:
      tags: [Nodes]
      summary: Get node agreements
      operationId: partnerGetNodeAgreements
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
