  /api/v1/{org}/nodes/{id}/errors:
    get:
      tags: [Nodes]
      summary: Get node errors
      operationId: partnerGetNodeErrors
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: id
