  # =============================================================
  # Agent File Version
  # =============================================================
  /api/v1/{org}/AgentFileVersion:
    get:
      tags: [Agent File Version]
      summary: Get agent file version
      operationId: partnerGetAgentFileVersion
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: Agent file version info

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Partner API key. Format: `nk_live_<base64url>` (production) or
        `nk_test_<base64url>` (non-production). Issued by the NereidAI console
        and bound to a single organization.

  parameters:
    OrgPath:
      name: org
      in: path
      required: true
      schema:
        type: string
      description: |
        Organization ID. Must match the org the API key is bound to.
        Cross-org requests are rejected with 403.
      example: myorg
