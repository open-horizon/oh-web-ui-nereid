  /api/v1/{org}/nodes/{id}/status:
    get:
      tags: [Nodes]
      summary: Get node status
      operationId: partnerGetNodeStatus
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: id
          in: path
