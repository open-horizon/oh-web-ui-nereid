#
# Local docker build stack (test environment) — SEPARATE from the production
# docker-compose.yaml (ghcr images). Every resource is isolated from prod:
#   - unique container names (suffix "-dev")
#   - unique host ports (frontend :8091, pg :5434)
#   - unique volumes / network created by the "nereid-dev" project name.
#
# Use via:  make docker-dev-up / docker-dev-down / ...
# These define their own postgres + locally built backend/frontend.
#
services:
  postgres:
    container_name: open-horizon-exchangeui-postgres-dev
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=nereid
      - POSTGRES_USER=nereid
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nereidpass}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereid -d nereid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  open-horizon-exchangeui-backend:
    container_name: open-horizon-exchangeui-backend-dev
    build:
      context: .
      target: backend
    image: nereid-exchangeui-backend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgres://nereid:${POSTGRES_PASSWORD:-nereidpass}@postgres:5432/nereid
      - SESSION_TTL=86400
      - SESSION_ABS_TTL=28800
      # 32-byte (64 hex) master key for encrypting sessions at rest.
      - SESSION_ENC_KEY=${SESSION_ENC_KEY:?SESSION_ENC_KEY is required (64 hex chars)}
      # Optional OpenID Connect SSO; unset OIDC_ISSUER to disable.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_LOCAL_LOGIN_ENABLED=${OIDC_LOCAL_LOGIN_ENABLED:-true}
      - OIDC_INSECURE_SKIP_VERIFY=${OIDC_INSECURE_SKIP_VERIFY:-false}
    volumes:
      - nereid-logs-dev:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  open-horizon-exchangeui-frontend:
    container_name: open-horizon-exchangeui-frontend-dev
    build:
      context: .
      target: frontend
    image: nereid-exchangeui-frontend:latest
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      # Override the prod nginx config (which proxies to the prod *backend* and
      # forces TLS) with a dev variant that proxies to this dev backend over HTTP.
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      open-horizon-exchangeui-backend:
        condition: service_healthy

volumes:
  nereid-logs-dev:
  postgres-data-dev:
