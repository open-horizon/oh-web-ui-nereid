name: Publish Images

# Publish multi-arch (amd64, arm64) images to GHCR when a release is published
# or a version tag (v*.*.*) is pushed.
on:
  release:
    types: [published]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: backend
            image: open-horizon-exchangeui-backend
          - target: frontend
            image: open-horizon-exchangeui-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target ${{ matrix.target }} \
            --tag ghcr.io/nereidai/${{ matrix.image }}:${{ github.ref_name }} \
            --tag ghcr.io/nereidai/${{ matrix.image }}:latest \
            --push \
            .
