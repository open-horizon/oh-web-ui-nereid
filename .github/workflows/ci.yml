name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Typecheck & Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    name: Docker Build (Backend + Frontend)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --target backend -t oh-web-ui-nereid-backend:ci .
      - name: Build frontend image
        run: docker build --target frontend -t oh-web-ui-nereid-frontend:ci .

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    env:
      # Dummy 32-byte master key so the required ${SESSION_ENC_KEY:?} guard passes.
      SESSION_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.dev.yaml config -q
          docker compose -f deploy/docker-compose.myorg-agbot.yml config -q

  backend-syntax:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Check server syntax
        run: |
          for f in server/*.cjs; do node --check "$f"; done
      - name: Backend unit tests
        run: node --test server/*.test.cjs
