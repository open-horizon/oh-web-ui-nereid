name: Bug report
description: Report a problem with NereidAI
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: exchange-version
    attributes:
      label: Open Horizon Exchange version
      placeholder: e.g. 2.154.0
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment mode
      options:
        - Docker Compose
        - Local dev (npm)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Browser console / backend logs / audit log entries (redact secrets).
      render: shell
